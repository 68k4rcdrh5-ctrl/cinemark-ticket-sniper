name: watch

on:
  schedule:
    # Run every 25 minutes.
    - cron: "3,28,53 * * * *"

  workflow_dispatch:
    inputs:
      test_alert:
        description: "Fire a test alert instead of sweeping"
        type: boolean
        default: false

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Test alert
        if: ${{ inputs.test_alert }}
        run: >-
          ./notify-hook
          "Test alert"
          "The email channel works."

      - name: Run sweep
        if: ${{ !inputs.test_alert }}
        run: python3 watch.py

      - name: Persist state
        if: ${{ !inputs.test_alert }}
        run: |
          git config user.name "odyssey-watcher[bot]"
          git config user.email "actions@users.noreply.github.com"

          git add state.json alerts.log 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "state: sweep $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main || true
            git push
          fi