name: watch

on:
  schedule:
    # Run every 20 minutes.
    - cron: "3,23,43 * * * *"

  workflow_dispatch:
    inputs:
      test_alert:
        description: "Fire a test alert instead of sweeping"
        type: boolean
        default: false

      dates:
        description: "Optional dates to scan manually, e.g. 2026-09-01 2026-09-02"
        required: false
        type: string

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest

    # A full sweep of all Showtime IDs can take
    # several minutes because requests are deliberately
    # paced to reduce Cinemark rate limiting.
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test alert
        if: ${{ inputs.test_alert }}
        run: >-
          ./notify-hook
          "Test alert"
          "The email channel works."

      - name: Run scheduled full sweep
        if: ${{ !inputs.test_alert && !inputs.dates }}
        run: python3 watch.py --once

      - name: Run manual date sweep
        if: ${{ !inputs.test_alert && inputs.dates }}
        run: |
          python3 watch.py --once --dates ${{ inputs.dates }}

      - name: Persist state
        if: ${{ !inputs.test_alert }}
        run: |
          git config user.name "odyssey-watcher[bot]"
          git config user.email "actions@users.noreply.github.com"

          git add state.json alerts.log 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "state: sweep $(date -u '+%Y-%m-%d %H:%M UTC')"

            git pull --rebase --autostash origin main || true

            git push
          fi